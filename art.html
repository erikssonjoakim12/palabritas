<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="icon-192.png" />
    <title>Palabritas art</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f4f4ec; color: #222; margin: 0; padding: 16px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      h2 { font-size: 16px; margin: 28px 0 8px; border-bottom: 2px solid #ccc; padding-bottom: 4px; }
      p { margin: 4px 0; color: #555; font-size: 14px; }
      .grid { display: flex; flex-wrap: wrap; gap: 14px; }
      .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 8px; text-align: center; font-size: 12px; }
      .card canvas { image-rendering: pixelated; display: block; margin: 0 auto 4px; }
      .card .types { margin-top: 4px; display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
      .card .type { display: inline-flex; align-items: center; gap: 3px; border: 2px solid; border-radius: 10px; padding: 0 6px; font-size: 11px; }
      .card .type canvas { display: inline; width: 10px; height: 10px; margin: 0; }
      .card .theme { margin-top: 3px; color: #666; font-size: 11px; }
      .card .dex { margin: 4px auto 0; max-width: 220px; font-size: 11px; line-height: 1.3; text-align: left; }
      .card .dex .en { color: #777; margin-top: 2px; }
      .row { display: flex; gap: 6px; justify-content: center; align-items: flex-end; }
      .icons canvas { border-radius: 22%; box-shadow: 0 2px 8px #0004; }
    </style>
  </head>
  <body>
    <!-- The art review page: npm run art, or art.html next to the published game. -->
    <h1>Palabritas art</h1>
    <p>Everything the game draws, generated from the same code the game uses. Edit the art in <code>src/style/</code> and <code>src/art/</code>, then reload. The words: <a href="palabras.html">palabras.html</a>. The music: <a href="musica.html">musica.html</a>.</p>
    <div id="art"></div>
    <script type="module" src="/src/dev/art.ts"></script>
  </body>
</html>
