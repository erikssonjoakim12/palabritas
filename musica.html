<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="icon-192.png" />
    <title>Palabritas music</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f4f4ec; color: #222; margin: 0; padding: 16px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      h2 { font-size: 16px; margin: 24px 0 8px; border-bottom: 2px solid #ccc; padding-bottom: 4px; }
      p { margin: 4px 0; color: #555; font-size: 14px; }
      a { color: #2a6a9a; }
      .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 12px 0; font-size: 14px; }
      .controls label { white-space: nowrap; }
      .songs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
      .song { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
      .song h3 { margin: 0 0 2px; font-size: 16px; }
      .song .en { color: #777; font-size: 13px; margin-bottom: 6px; }
      .song .facts { font-size: 12px; color: #666; margin: 6px 0; }
      .song button { font-size: 15px; padding: 8px 16px; border-radius: 6px; border: 1px solid #888; background: #e8f0e0; cursor: pointer; }
      .song.playing { border-color: #58a040; box-shadow: 0 0 0 2px #b8e0a0; }
      .song.playing button { background: #f0d8d0; }
    </style>
  </head>
  <body>
    <!-- The music samples (npm run music, or musica.html next to the game). Not in the game yet. -->
    <h1>Palabritas music</h1>
    <p>
      The game's Game Boy-style music, made in code like the sound effects. Mute a voice to hear the others. Words: <a href="palabras.html">palabras.html</a> · Art: <a href="art.html">art.html</a>.
    </p>
    <div id="music"></div>
    <script type="module" src="/src/dev/music.ts"></script>
  </body>
</html>
