<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="icon-192.png" />
    <title>Palabritas world map</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f4f4ec; color: #222; margin: 0; padding: 16px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p { margin: 4px 0; color: #555; font-size: 14px; }
      button { font: inherit; font-size: 13px; background: #fff; border: 1px solid #ccc; border-radius: 12px; padding: 2px 10px; cursor: pointer; }
      button.on { background: #2a6a9a; border-color: #2a6a9a; color: #fff; }
      .zoom, .places { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
      .places button { font-size: 12px; border-radius: 4px; }
      .view { overflow: auto; max-height: 85vh; border: 1px solid #ccc; background: #2a3a28; }
      canvas.world { image-rendering: pixelated; display: block; }
    </style>
  </head>
  <body>
    <!-- The world map: npm run world, or mundo.html next to the published game. -->
    <h1>Palabritas world map</h1>
    <p>
      All towns and routes together, placed by their connections. Each is still its own map: change one and this updates by
      itself. If paths don't line up at an edge, that map's connection offset needs adjusting.
    </p>
    <div id="world"></div>
    <script type="module" src="/src/dev/world.ts"></script>
  </body>
</html>
